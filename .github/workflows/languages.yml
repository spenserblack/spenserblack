name: Languages

on:
  workflow_dispatch:

jobs:
  languages:
    name: Languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: spenserblack/github-polyglot@v0.1
        id: github-polyglot
        with:
          format: svg
          token: ${{ secrets.PAT }}
      - name: Update languages.svg
        env:
          OUTPUT: ${{ steps.github-polyglot.outputs.output }}
        run: echo "$OUTPUT" > languages.svg
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git commit -m "Auto-commit: Update languages.svg"
          git push
